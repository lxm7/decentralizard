{{- if .Values.externalSecrets.enabled }}
# Cluster-wide store. No auth block: the ESO controller pod's IRSA role supplies
# credentials (scoped to the SSM prefix in iam.tf).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.externalSecrets.clusterSecretStore }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ .Values.externalSecrets.region }}
{{- end }}
